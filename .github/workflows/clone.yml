name: Clone study

on:
  workflow_dispatch:
    inputs:
      study_url:
        description: "Teacher's study link (https://lichess.org/study/…)"
        required: true
      name:
        description: "Name for Julen's copy (empty = original name + ' - julen')"
        required: false
        default: ""
      force:
        description: "Copy even if Julen already has a study with that name"
        type: boolean
        default: false
      notify:
        description: "Send the copy's link to markel3 (text in clone_message.txt)"
        type: boolean
        default: true

permissions:
  contents: write   # record the original in shared_studies.txt
  actions: write    # start a sync afterwards

concurrency:
  group: clone
  cancel-in-progress: false

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy the study into Julen's account
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_WRITE_TOKEN || secrets.LICHESS_TOKEN }}
          STUDY_URL: ${{ inputs.study_url }}
          STUDY_NAME: ${{ inputs.name }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          NOTIFY: ${{ inputs.notify && '--notify markel3' || '' }}
        run: |
          python .claude/skills/clone-lichess-study/scripts/clone_study.py "$STUDY_URL" \
            --name "$STUDY_NAME" --suffix " - julen" $FORCE $NOTIFY --message @clone_message.txt \
            --record shared_studies.txt --summary "$GITHUB_STEP_SUMMARY"

      - name: Remember the original for the tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared_studies.txt
          git commit -q -m "Record cloned study $(tail -n1 shared_studies.txt | cut -d' ' -f1-2)"
          git push -q

      - name: Refresh the dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync.yml --ref main
